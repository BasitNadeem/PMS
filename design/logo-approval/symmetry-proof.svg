<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Selected logo symmetry approval proof</title>
  <desc id="desc">A single diagonal quadrant mirrored across its 45-degree bisector and the complete mark assembled from four rotations.</desc>
  <defs>
    <path id="quadrant" d="M164 36 215 86 183 137 234 105 284 156H204C188 156 164 132 164 116Z"/>
    <g id="complete-mark">
      <use href="#quadrant"/>
      <use href="#quadrant" transform="rotate(90 160 160)"/>
      <use href="#quadrant" transform="rotate(180 160 160)"/>
      <use href="#quadrant" transform="rotate(270 160 160)"/>
    </g>
  </defs>

  <rect width="1500" height="820" fill="#F5EBE4"/>
  <text x="90" y="90" fill="#211E1A" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="5">SYMMETRY APPROVAL PROOF</text>
  <text x="90" y="130" fill="#938C81" font-family="Arial, Helvetica, sans-serif" font-size="18">One mirrored diagonal quadrant · repeated at 90° · no production assets yet</text>

  <g transform="translate(90 190)">
    <rect width="610" height="540" rx="28" fill="#FAF8F4"/>
    <text x="34" y="52" fill="#938C81" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">ONE OF FOUR QUADRANTS</text>
    <text x="34" y="82" fill="#4A453E" font-family="Arial, Helvetica, sans-serif" font-size="16">A single connected shape, mirrored through its diagonal</text>
    <g transform="translate(-80 52) scale(1.75)" fill="#E0532B">
      <use href="#quadrant"/>
      <line x1="148" y1="172" x2="300" y2="20" stroke="#C2431F" stroke-width="1.5" stroke-dasharray="5 6" opacity=".55"/>
    </g>
    <g transform="translate(52 438)">
      <circle cx="7" cy="7" r="7" fill="#E0532B"/>
      <text x="26" y="13" fill="#4A453E" font-family="Arial, Helvetica, sans-serif" font-size="16">Mirror symmetry through its 45° bisector</text>
      <text x="26" y="43" fill="#938C81" font-family="Arial, Helvetica, sans-serif" font-size="15">Outer corners, V-notch and central curve are mirrored</text>
    </g>
  </g>

  <g transform="translate(800 190)">
    <rect width="610" height="540" rx="28" fill="#211E1A"/>
    <text x="34" y="52" fill="#B8B1A6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">FOUR-QUADRANT ASSEMBLY</text>
    <text x="34" y="82" fill="#938C81" font-family="Arial, Helvetica, sans-serif" font-size="16">Exact 90° rotations of the approved quadrant</text>
    <g transform="translate(105 84) scale(1.25)" fill="#E0532B">
      <use href="#complete-mark"/>
    </g>
    <g transform="translate(52 450)">
      <circle cx="7" cy="7" r="7" fill="#E0532B"/>
      <text x="26" y="13" fill="#B8B1A6" font-family="Arial, Helvetica, sans-serif" font-size="16">Four reflection axes + 90° rotational symmetry</text>
    </g>
  </g>
</svg>
